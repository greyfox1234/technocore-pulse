[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-pulse"
version = "1.0.0"
description = "Real-time stream monitor, DID keyring, and webhook notification toolkit for Technocore"
readme = "README.md"
authors = [{ name = "greyfox1234" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=48.0.0",
]

[project.scripts]
technocore-pulse = "technocore_pulse.cli:main"
pulse = "technocore_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
